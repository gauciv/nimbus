name: Deploy to EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test bot configuration
      run: |
        python -c "from utils.config import config; print('Config loaded successfully')"
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Navigate to project directory
          cd /home/ubuntu/nimbus-v2
          
          # Pull latest changes
          git pull origin main
          
          # Install/update dependencies
          /home/ubuntu/.local/bin/pip install -r requirements.txt
          
          # Restart bot with zero downtime
          sudo systemctl restart nimbus-bot
          
          # Check if service is running
          sleep 5
          sudo systemctl is-active nimbus-bot