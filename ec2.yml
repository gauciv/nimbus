AWSTemplateFormatVersion: '2010-09-09'
Description: 'Nimbus Bot - EC2 Free Tier with Auto-Deploy'

Resources:
  BotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nimbus bot security group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  BotInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0d07675d294f17973
      InstanceType: t3.micro
      KeyName: nimbus-key
      SecurityGroupIds:
        - !Ref BotSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      Tags:
        - Key: Name
          Value: Nimbus-Bot
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y docker git
          systemctl start docker
          systemctl enable docker
          usermod -a -G docker ec2-user
          
          curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          
          # Setup auto-deploy webhook
          mkdir -p /home/ec2-user/webhook
          cat > /home/ec2-user/webhook/deploy.sh << 'EOF'
          #!/bin/bash
          cd /home/ec2-user/nimbus-v2
          git pull origin main
          docker-compose down
          docker-compose up -d --build
          EOF
          chmod +x /home/ec2-user/webhook/deploy.sh
          
          # Install webhook listener
          yum install -y nodejs npm
          npm install -g webhook

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

Outputs:
  InstanceIP:
    Value: !GetAtt BotInstance.PublicIp